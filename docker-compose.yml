services:
  proxy:
    build: .
    image: opencode-warp-proxy:local
    container_name: opencode-warp-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=10m
    environment:
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8080}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      SESSION_ID: ${SESSION_ID:-}
      USER_AGENT: ${USER_AGENT:-opencode-warp-proxy/1.0}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-1048576}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-60000}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
